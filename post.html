<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beitrag — Zeitqualität | Kompass für Kopf und Seele</title>
  
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Zeitqualität">
  <meta property="og:url" content="https://zeitqualitaet.at/">
  <meta property="og:title" content="Zeitqualität – Mentale Souveränität & Strategisches Timing">
  <meta property="og:description" content="Zeitzyklen nutzen. Mentale Stärke trainieren. Souverän entscheiden in Business & Alltag.">
  <meta property="og:image" content="https://raw.githubusercontent.com/chreever/zeitqualitaet/main/img/christian-portraet.jpg">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="icon" type="image/svg+xml" href="/img/zq-favicon.svg?v=2">
  <link rel="alternate icon" href="/img/zq-favicon.png?v=2">
  <link rel="apple-touch-icon" href="/img/zq-favicon.png?v=2">

  <!-- Hier laden wir dein ausgelagertes, globales Design -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="starfield"><canvas id="stars"></canvas></div>

<nav>
  <div class="nav-inner">
    <a href="/" class="logo-container">
      <svg viewBox="0 0 120 120" style="height: 40px; width: 40px;">
        <defs>
            <linearGradient id="gold-logo" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f3e5ab"/><stop offset="50%" stop-color="#d4af37"/><stop offset="100%" stop-color="#997a26"/>
            </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="54" fill="none" stroke="url(#gold-logo)" stroke-width="1.5" opacity="0.4"/>
        <path d="M60 22 Q60 60 22 60 Q60 60 60 98 Q60 60 98 60 Q60 60 60 22 Z" fill="url(#gold-logo)"/>
      </svg>
      <span style="font-family: var(--font-display); font-size: 1.6rem; color: var(--text); letter-spacing: 0.05em;">Zeitqualität</span>
    </a>
    <div class="nav-links">
        <a href="/">← Zurück zur Übersicht</a>
    </div>
  </div>
</nav>

<div class="article-container">
  <a href="javascript:history.back()" class="back-btn">← Zurück</a>
  <div id="media-container"></div>
  <article id="post-content" class="post-content">
    <p style="text-align: center; color: var(--text-dim); margin-top: 4rem;">Signal wird gesucht...</p>
  </article>
  <div style="text-align: center;">
      <button id="share-btn" class="share-btn">↗ Beitrag teilen</button>
  </div>
</div>

<footer>
  <p>© 2026 Zeitqualität · Christian Balas</p>
</footer>

<div id="image-modal" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(7,8,11,0.95); backdrop-filter:blur(10px); cursor:zoom-out; align-items:center; justify-content:center; padding:2rem; flex-direction:column;">
  <img id="modal-img" src="" style="max-width:95%; max-height:85vh; border-radius:var(--radius); box-shadow:0 10px 40px rgba(0,0,0,0.5); border:1px solid var(--border);">
  <div id="modal-caption" style="color:var(--accent); font-family:var(--font-body); font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; margin-top:1.5rem; font-size:0.85rem; text-align:center; max-width:800px;"></div>
  <div style="position:absolute; top:2rem; right:2rem; color:var(--text-muted); font-family:var(--font-body); font-weight: 600; letter-spacing: 0.1em; font-size:0.75rem;">ESC ZUM SCHLIESSEN</div>
</div>

<script>
  const isMobile = window.innerWidth <= 768;

  // Starfield Hintergrund (nur Desktop)
  if (!isMobile) {
    (function(){
        const c=document.getElementById('stars'),x=c.getContext('2d');let s=[];
        function r(){c.width=window.innerWidth;c.height=window.innerHeight}
        function f(){s=[];for(let i=0;i<120;i++)s.push({x:Math.random()*c.width,y:Math.random()*c.height,z:Math.random()*1.2 + 0.2,p:Math.random()*Math.PI*2})}
        function d(t){
            x.clearRect(0,0,c.width,c.height);
            s.forEach(a=>{
                x.beginPath();x.arc(a.x,a.y,a.z,0,Math.PI*2);x.fillStyle="#F4F4F5";
                x.globalAlpha=Math.sin(t*0.0005+a.p)*0.2+0.2;x.fill()
            });
            requestAnimationFrame(d)
        }
        r();f();d(0);window.addEventListener('resize',()=>{r();f()})
    })();
  }

  function fixPath(p) { if(!p) return ""; let c=p.trim().replace(/['"]/g,''); return (c.startsWith('http')||c.startsWith('/'))?c:'/'+c; }

  async function renderPost() {
    const p = new URLSearchParams(window.location.search);
    let id = p.get('id'); if(!id) return;
    id = decodeURIComponent(id);

    try {
      let r = await fetch(`posts/${id}.md`);
      if(!r.ok) r = await fetch(`https://raw.githubusercontent.com/chreever/zeitqualitaet/main/posts/${id}.md`);
      if(!r.ok) throw new Error();
      
      const t = await r.text();
      let body = "", title = "", pImg = "", tImg = "", bVid = "", fVid = "", desc = "", category = "";

      // Frontmatter parsen
      if(t.startsWith('---')) {
        const parts = t.split('---');
        if(parts.length >= 3) {
          parts[1].split('\n').forEach(l => {
            const i = l.indexOf(':');
            if(i!==-1) {
              const k = l.substring(0,i).trim().toLowerCase(), v = l.substring(i+1).trim().replace(/['"]/g,'');
              if(k==='title') title=v; if(k==='post_image') pImg=v; if(k==='image') tImg=v;
              if(k==='video') bVid=v; if(k==='featured_video') fVid=v; if(k==='description') desc=v;
              if(k==='category') category=v;
            }
          });
          body = parts.slice(2).join('---').trim();
        }
      }

      // Medienanzeige
      const m = document.getElementById('media-container');
      const finalImg = pImg || tImg;
      if(finalImg) { m.innerHTML = `<img class="article-image" src="${fixPath(finalImg)}" alt="Beitrag">`; }
      else { const v = fVid || bVid; if(v) m.innerHTML = `<video class="article-image" autoplay muted loop playsinline><source src="${fixPath(v)}#t=0.1" type="video/mp4"></video>`; }

      // Content rendern
      let parsedContent = `<h1>${title || id}</h1>` + marked.parse(body);

      document.getElementById('post-content').innerHTML = parsedContent;
      document.title = `${title || 'Beitrag'} — Zeitqualität`;

      initLightbox();
      
    } catch(e) {
      document.getElementById('post-content').innerHTML = `<h1>Signal verloren</h1><p>Beitrag "${id}" konnte nicht geladen werden. Möglicherweise wurde die Seite verschoben.</p>`;
    }
  }

  // Lightbox
  function initLightbox() {
    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('modal-img');
    const modalCaption = document.getElementById('modal-caption');
    const content = document.getElementById('post-content');

    if(content) {
      content.querySelectorAll('img').forEach(img => {
        img.onclick = () => {
          modal.style.display = 'flex';
          modalImg.src = img.src;
          
          const parent = img.closest('figure');
          const caption = parent ? parent.querySelector('figcaption') : img.nextElementSibling;
          
          if (caption && (caption.tagName === 'FIGCAPTION' || caption.tagName === 'EM')) {
            modalCaption.innerText = caption.innerText;
          } else {
            modalCaption.innerText = "";
          }
        };
      });
    }

    modal.onclick = () => { modal.style.display = 'none'; };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') modal.style.display = 'none';
    });
  }

  renderPost();

  // Share Button
  const sb = document.getElementById('share-btn');
  if(sb) sb.addEventListener('click', async () => {
    if(navigator.share) { try { await navigator.share({title:document.title, url:window.location.href}); } catch(e){} }
    else { navigator.clipboard.writeText(window.location.href); sb.innerHTML = '✨ Link kopiert!'; setTimeout(()=>sb.innerHTML='↗ Beitrag teilen',2000); }
  });
</script>
</body>
</html>
