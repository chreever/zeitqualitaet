<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beitrag — Zeitqualität | Kompass für Kopf und Seele</title>
  
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Zeitqualität">
  <meta property="og:url" content="https://zeitqualitaet.at/">
  <meta property="og:title" content="Zeitqualität – Mentale Souveränität & Strategisches Timing">
  <meta property="og:description" content="Zeitzyklen nutzen. Mentale Stärke trainieren. Souverän entscheiden in Business & Alltag.">
  <meta property="og:image" content="https://raw.githubusercontent.com/chreever/zeitqualitaet/main/img/zq-favicon.png">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="icon" type="image/svg+xml" href="/img/zq-favicon.svg?v=3">
  <link rel="alternate icon" href="/img/zq-favicon.png?v=3">
  <link rel="apple-touch-icon" href="/img/zq-favicon.png?v=3">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="logo-container">
      <svg viewBox="0 0 120 120" style="height: 40px; width: 40px;">
        <circle cx="60" cy="60" r="54" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0.4"/>
        <path d="M60 22 Q60 60 22 60 Q60 60 60 98 Q60 60 98 60 Q60 60 60 22 Z" fill="var(--accent)"/>
      </svg>
      <span style="font-family: var(--font-display); font-size: 1.6rem; color: var(--text); font-weight: 600; letter-spacing: 0.05em;">Zeitqualität</span>
    </a>
    <div class="nav-links">
        <a href="/">← Zurück zur Übersicht</a>
    </div>
  </div>
</nav>

<div class="article-container">
  <a href="javascript:history.back()" class="back-btn">← Zurück</a>
  <div id="media-container"></div>
  <article id="post-content" class="post-content">
    <p style="text-align: center; color: var(--text-dim); margin-top: 4rem;">Signal wird gesucht...</p>
  </article>
  <div style="text-align: center;">
      <button id="share-btn" class="share-btn">↗ Beitrag teilen</button>
  </div>
</div>

<footer>
  <p style="color: var(--text-muted); font-size: 0.85rem;">© 2026 Zeitqualität · Christian Balas</p>
</footer>

<div id="image-modal" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(255,255,255,0.95); backdrop-filter:blur(10px); cursor:zoom-out; align-items:center; justify-content:center; padding:2rem; flex-direction:column;">
  <img id="modal-img" src="" style="max-width:95%; max-height:85vh; border-radius:var(--radius); box-shadow:0 10px 40px rgba(0,0,0,0.1); border:1px solid var(--border);">
  <div id="modal-caption" style="color:var(--accent); font-family:var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin-top:1.5rem; font-size:0.85rem; text-align:center; max-width:800px;"></div>
  <div style="position:absolute; top:2rem; right:2rem; color:var(--text-muted); font-family:var(--font-body); font-weight: 600; letter-spacing: 0.1em; font-size:0.75rem;">ESC ZUM SCHLIESSEN</div>
</div>

<script>
  function fixPath(p) { if(!p) return ""; let c=p.trim().replace(/['"]/g,''); return (c.startsWith('http')||c.startsWith('/'))?c:'/'+c; }

  async function renderPost() {
    const p = new URLSearchParams(window.location.search);
    let id = p.get('id'); if(!id) return;
    id = decodeURIComponent(id);

    try {
      let r = await fetch(`posts/${id}.md`);
      if(!r.ok) r = await fetch(`https://raw.githubusercontent.com/chreever/zeitqualitaet/main/posts/${id}.md`);
      if(!r.ok) throw new Error();
      
      const t = await r.text();
      let body = "", title = "", pImg = "", tImg = "", bVid = "", fVid = "", desc = "", category = "";

      // Frontmatter parsen
      if(t.startsWith('---')) {
        const parts = t.split('---');
        if(parts.length >= 3) {
          parts[1].split('\n').forEach(l => {
            const i = l.indexOf(':');
            if(i!==-1) {
              const k = l.substring(0,i).trim().toLowerCase(), v = l.substring(i+1).trim().replace(/['"]/g,'');
              if(k==='title') title=v; if(k==='post_image') pImg=v; if(k==='image') tImg=v;
              if(k==='video') bVid=v; if(k==='featured_video') fVid=v; if(k==='description') desc=v;
              if(k==='category') category=v;
            }
          });
          body = parts.slice(2).join('---').trim();
        }
      }

      // Medienanzeige (Repariert & Farbschema-Fallback hinzugefügt)
      const m = document.getElementById('media-container');
      const finalImg = pImg || tImg;
      const finalVid = fVid || bVid;

      if (finalVid && finalVid !== "") { 
        m.innerHTML = `<video class="article-image" autoplay muted loop playsinline><source src="${fixPath(finalVid)}#t=0.1" type="video/mp4"></video>`; 
      } 
      else if (finalImg && finalImg !== "") { 
        // alt="" lässt den Text komplett verschwinden, falls das Bild fehlt
        m.innerHTML = `<img class="article-image" src="${fixPath(finalImg)}" alt="">`; 
      } 
      else { 
        // Hochwertiges Farbschema, wenn weder Video noch Bild vorhanden sind
        m.innerHTML = `<div style="width: 100%; height: 450px; background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); border-radius: var(--radius); border: 1px solid var(--border-light); box-shadow: 0 10px 30px rgba(0,0,0,0.05);"></div>`; 
      }

      // Content rendern
      let parsedContent = `<h1>${title || id}</h1>` + marked.parse(body);

      document.getElementById('post-content').innerHTML = parsedContent;
      document.title = `${title || 'Beitrag'} — Zeitqualität`;
      
      // Social Media Tags dynamisch anpassen
      const ogImage = document.querySelector('meta[property="og:image"]');
      const ogTitle = document.querySelector('meta[property="og:title"]');
      const ogDesc = document.querySelector('meta[property="og:description"]');
      const metaDesc = document.querySelector('meta[name="description"]');

      if (finalImg && ogImage) ogImage.setAttribute('content', window.location.origin + fixPath(finalImg));
      if (title && ogTitle) ogTitle.setAttribute('content', title);
      if (desc) {
        if (ogDesc) ogDesc.setAttribute('content', desc);
        if (metaDesc) metaDesc.setAttribute('content', desc);
      }

      initLightbox();
      
    } catch(e) {
      document.getElementById('post-content').innerHTML = `<h1>Signal verloren</h1><p>Beitrag "${id}" konnte nicht geladen werden. Möglicherweise wurde die Seite verschoben.</p>`;
    }
  }

  // Lightbox
  function initLightbox() {
    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('modal-img');
    const modalCaption = document.getElementById('modal-caption');
    const content = document.getElementById('post-content');

    if(content) {
      content.querySelectorAll('img').forEach(img => {
        img.onclick = () => {
          modal.style.display = 'flex';
          modalImg.src = img.src;
          
          const parent = img.closest('figure');
          const caption = parent ? parent.querySelector('figcaption') : img.nextElementSibling;
          
          if (caption && (caption.tagName === 'FIGCAPTION' || caption.tagName === 'EM')) {
            modalCaption.innerText = caption.innerText;
          } else {
            modalCaption.innerText = "";
          }
        };
      });
    }

    modal.onclick = () => { modal.style.display = 'none'; };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') modal.style.display = 'none';
    });
  }

  renderPost();

  // Share Button
  const sb = document.getElementById('share-btn');
  if(sb) sb.addEventListener('click', async () => {
    if(navigator.share) { try { await navigator.share({title:document.title, url:window.location.href}); } catch(e){} }
    else { navigator.clipboard.writeText(window.location.href); sb.innerHTML = '✨ Link kopiert!'; setTimeout(()=>sb.innerHTML='↗ Beitrag teilen',2000); }
  });
</script>
</body>
</html>
