<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danke — Zeitqualität | Christian Balas</title>
    
    <link rel="icon" type="image/svg+xml" href="/img/zq-favicon.svg?v=3">
    <link rel="alternate icon" href="/img/zq-favicon.png?v=3">
    <link rel="apple-touch-icon" href="/img/zq-favicon.png?v=3">

    <style>
        /* ── FONTS ── */
        @font-face { font-family: 'Figtree'; src: url('/fonts/figtree.woff2') format('woff2'); font-weight: 300; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Figtree'; src: url('/fonts/figtree-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Figtree'; src: url('/fonts/figtree-500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Figtree'; src: url('/fonts/figtree-600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }

        :root {
            --bg: #F8F9FA; 
            --bg-card: #FFFFFF;
            --text: #111827; 
            --text-muted: #4B5563; 
            --accent: #0F172A; 
            --accent-light: #334155; 
            --border: #E5E7EB; 
            
            --font-display: 'Figtree', system-ui, sans-serif;
            --font-body: 'Figtree', system-ui, sans-serif;
            
            --radius: 12px;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: var(--font-body); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .card { 
            background: var(--bg-card);
            border: 1px solid var(--border); 
            padding: 4rem 3rem; 
            border-radius: var(--radius); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
            animation: fadeUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.05);
            color: var(--accent);
        }

        h1 { 
            color: var(--accent); 
            font-family: var(--font-display); 
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        .btn-primary { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            padding: 14px 32px; 
            background: var(--accent); 
            color: #FFFFFF !important; 
            border-radius: 100px; 
            font-size: 0.95rem; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            transition: var(--transition); 
            text-decoration: none;
        }

        .btn-primary:hover { 
            background: var(--accent-light); 
            transform: translateY(-3px); 
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15); 
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        </div>
        <h1>Nachricht empfangen</h1>
        <p>Vielen Dank für deine Kontaktaufnahme. Ich habe deine Zeilen erhalten und werde mich in Kürze bei dir melden.</p>
        <a href="/" class="btn-primary">Zurück zur Startseite</a>
    </div>
</body>
</html>
