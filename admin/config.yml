backend:
  name: git-gateway
  branch: main

locale: "de"

media_folder: "img"
public_folder: "/img"

collections:
  - name: "posts"
    label: "Beiträge"
    folder: "posts"
    create: true
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - label: "Kategorie"
        name: "category"
        widget: "select"
        default: "Zeitqualität"
        options: ["Mentale Stärke", "Zeitqualität", "Reflexion", "Persönlich", "Archetypen", "Allgemein"]
      - label: "Datum"
        name: "date"
        widget: "datetime"
        date_format: "DD.MM.YYYY"
        time_format: "HH:mm"
        format: "YYYY-MM-DDTHH:mm:ssZ"
      - {label: "Kachel-Bild & Social Media (WICHTIG!)", name: "image", widget: "image", required: true}
      - {label: "Optional: Bewegtes Kachel-Video (MP4)", name: "featured_video", widget: "file", required: false}
      - {label: "Banner-Bild (Hintergrund)", name: "banner_image", widget: "image", required: false}
      - {label: "Banner-Video (MP4)", name: "video", widget: "file", required: false}
      - {label: "Hauptfoto im Blog-Artikel", name: "post_image", widget: "image", required: false}
      - {label: "Kurzbeschreibung", name: "description", widget: "text", required: false}
      - label: "Banner-Platzierung"
        name: "placement"
        widget: "select"
        options:
          - { label: "Kein Banner", value: "Kein Banner" }
          - { label: "Top-Banner (Header)", value: "Top-Banner (Header)" }
          - { label: "Info-Banner (Mitte)", value: "Info-Banner (Mitte)" }
        default: "Kein Banner"
        required: false
      - label: "Inhalt"
        name: "body"
        widget: "markdown"
        default: "Die aktuelle Zeitqualität bringt spürbare Veränderungen mit sich.\n\n## 1. Systemische Analyse (Kontext)\nWas passiert gerade? Der Fokus verschiebt sich...\n\n## 2. Business- & Alltagstransfer (Kairos)\nWhat bedeutet das konkret? \n- **Gut für:** \n- **Schwierig für:** \n\n## 3. Dein mentaler Impuls\n> **Reflexionsfrage:** Wo halte ich aktuell an einer Strategie fest, die nicht mehr zur Dynamik passt?\n"

  - name: "tagesimpulse"
    label: "Tagesimpulse (Monats-Listen)"
    folder: "img/impulses"
    extension: "json"
    format: "json"
    create: true
    slug: "{{year}}-{{month}}"
    summary: "Monatsliste: {{date}}"
    fields:
      - label: "Monat auswählen (Klicke einfach irgendeinen Tag in dem gewünschten Monat an)"
        name: "date"
        widget: "datetime"
        date_format: "MM.YYYY"
        time_format: false
        format: "YYYY-MM-DD"
      - { label: "Ganze Monats-Liste hier reinkopieren", name: "text_list", widget: "text" }
